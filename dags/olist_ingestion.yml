olist_csv_to_parquet:

  default_args:
    owner: "data-engineering"
    start_date: 2026-08-01
    retries: 1

  description: "End-to-end Olist ingestion, transformation, and analytics pipeline"

  schedule: null

  catchup: false

  max_active_runs: 1

  tags:
    - olist
    - use_case_02
    - ingestion

  tasks:

    - task_id: discover_datasets
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable_name: discover_datasets
      python_callable_file: /opt/airflow/dags/olist_tasks.py


    - task_id: csv_to_parquet
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable_name: csv_to_parquet
      python_callable_file: /opt/airflow/dags/olist_tasks.py

      expand:
        op_args: discover_datasets.output


    - task_id: upload_parquet_to_stage
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable_name: upload_parquet_to_stage
      python_callable_file: /opt/airflow/dags/olist_tasks.py

      expand:
        op_args: csv_to_parquet.output


    - task_id: copy_parquet_to_raw
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable_name: copy_parquet_to_raw
      python_callable_file: /opt/airflow/dags/olist_tasks.py

      expand:
        op_args: upload_parquet_to_stage.output


    - task_id: validate_raw_load
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable_name: validate_raw_load
      python_callable_file: /opt/airflow/dags/olist_tasks.py

      expand:
        op_args: copy_parquet_to_raw.output


    - task_id: dbt_run_staging
      operator: airflow.providers.standard.operators.bash.BashOperator

      bash_command: >
        cd /opt/airflow/dbt &&
        dbt run --select staging
        --project-dir /opt/airflow/dbt
        --profiles-dir /opt/airflow/dbt

      dependencies:
        - validate_raw_load


    - task_id: dbt_test_staging
      operator: airflow.providers.standard.operators.bash.BashOperator

      bash_command: >
        cd /opt/airflow/dbt &&
        dbt test --select staging
        --project-dir /opt/airflow/dbt
        --profiles-dir /opt/airflow/dbt

      dependencies:
        - dbt_run_staging


    - task_id: dbt_run_marts
      operator: airflow.providers.standard.operators.bash.BashOperator

      bash_command: >
        cd /opt/airflow/dbt &&
        dbt run --select marts
        --project-dir /opt/airflow/dbt
        --profiles-dir /opt/airflow/dbt

      dependencies:
        - dbt_test_staging


    - task_id: dbt_test_marts
      operator: airflow.providers.standard.operators.bash.BashOperator

      bash_command: >
        cd /opt/airflow/dbt &&
        dbt test --select marts
        --project-dir /opt/airflow/dbt
        --profiles-dir /opt/airflow/dbt

      dependencies:
        - dbt_run_marts