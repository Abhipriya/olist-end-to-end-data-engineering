version: 2

models:

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        data_tests:
          - not_null


  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_status
        data_tests:
          - not_null

      - name: order_purchase_timestamp
        data_tests:
          - not_null


  - name: stg_order_items
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: order_item_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: price
        data_tests:
          - not_null


  - name: stg_order_payments
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: payment_sequential
        data_tests:
          - not_null

      - name: payment_type
        data_tests:
          - not_null

      - name: payment_value
        data_tests:
          - not_null


  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique